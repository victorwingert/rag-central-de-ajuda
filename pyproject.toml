# ============================
# Projeto
# ============================
[project]
name = "rag-central-de-ajuda"
version = "0.1.0"
description = "RAG com avaliação sobre a central de ajuda de um app de delivery fictício"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.7.0",
    "litellm>=1.70.0",
    "numpy>=2.2.0",
    "pydantic>=2.11.0",
]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.0",
]

# ============================
# Lint e formatação (Ruff)
# ============================
[tool.ruff]
line-length = 88
target-version = "py313"
fix = true
show-fixes = true
indent-width = 4
exclude = ["venv", ".venv", "env", ".env", "node_modules", "__pycache__"]

[tool.ruff.lint]
select = [
    "ASYNC", "A", "ANN", "B", "BLE", "C4", "C90", "COM", "E", "EM", "ERA",
    "EXE", "F", "FBT", "FIX", "I", "ICN", "ISC", "Q", "RET", "RSE", "S",
    "SIM", "SLF", "T10", "T20", "TC", "TD", "TRY", "UP", "W", "YTT", "RUF", "N",
]
ignore = ["T201", "COM812"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101", "SLF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["rag"]

# ============================
# Tipagem (Pyright)
# ============================
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]
exclude = ["**/.venv", "**/__pycache__", "**/.*"]
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
